
<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Burger House</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="fotos/logo.png">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- JavaScript -->
    <script src="dbs.js" defer></script>
    <script src="basket.js" defer></script>
    <script src="menu.js" defer></script>
    <script src="checkout.js" defer></script>
</head>

<body>

    <!-- ==================================
         HEADER
    ================================== -->

    <header>

        <div class="logo">
            <img src="fotos/logo.png" alt="Burger House">
        </div>

    </header>


    <!-- ==================================
         HAUPTBEREICH
    ================================== -->

    <main class="all">

        <!-- LOGO UND NAME -->

        <section class="content">

            <div class="logo1">
                <img src="fotos/name.png" alt="Burger House">
            </div>

        </section>


        <!-- ==================================
             SPEISEKARTE
        ================================== -->

        <section class="menu-section">

            <div class="List">

                <h2>Unsere Speisekarte</h2>

                <p>
                    Entdecke unsere Burger, Beilagen und Getränke.
                </p>

            </div>


            <!-- KATEGORIE SLIDER -->

            <nav
                class="category-slider"
                id="categorySlider"
                aria-label="Speisekarten-Kategorien">
            </nav>


            <!-- ==================================
                 MENÜ UND WARENKORB
            ================================== -->

            <div class="container">


                <!-- MENÜ -->

                <div
                    class="menu"
                    id="menu">
                </div>


                <!-- ==================================
                     WARENKORB
                ================================== -->

                <aside class="basket">

                    <h2>Dein Warenkorb</h2>


                    <!-- PRODUKTLISTE
                         Nur dieser Bereich scrollt -->

                    <div
                        class="basket-items"
                        id="basketItems">

                    </div>


                    <!-- UNTERER BEREICH
                         Bleibt immer sichtbar -->

                    <div class="basket-footer">

                        <hr>


                        <!-- ZWISCHENSUMME -->

                        <p>
                            <span>Zwischensumme:</span>

                            <span>
                                <span id="subtotal">0.00</span> €
                            </span>
                        </p>


                        <!-- LIEFERKOSTEN -->

                        <p>
                            <span>Lieferkosten:</span>

                            <span>
                                <span id="delivery">4.99</span> €
                            </span>
                        </p>


                        <!-- GESAMTPREIS -->

                        <p class="total">
                            <span>Gesamt:</span>

                            <span>
                                <span id="total">0.00</span> €
                            </span>
                        </p>


                        <!-- WARENKORB LEEREN -->

                        <button
                            type="button"
                            class="clear-button"
                            onclick="clearBasket()">

                            Warenkorb leeren

                        </button>


                        <!-- CHECKOUT -->

                        <button
                            type="button"
                            class="checkout-button"
                            onclick="checkout()">

                            Jetzt kaufen

                        </button>

                    </div>

                </aside>

            </div>

        </section>

    </main>


    <!-- ==================================
         FOOTER
    ================================== -->

    <footer class="footer">

        <p>
            © 2026 Burger House | Alle Rechte vorbehalten.
        </p>

    </footer>

</body>

</html>
