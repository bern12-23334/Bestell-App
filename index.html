```html
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Burger House</title>

    <link rel="stylesheet" href="style.css">

    <script src="dbs.js" defer></script>
    <script src="basket.js" defer></script>
    <script src="menu.js" defer></script>
    <script src="checkout.js" defer></script>
</head>

<body>

<header>
    <div class="logo">
        <img src="fotos/logo.png" alt="Burger House">
    </div>
</header>

<main class="all">

    <section class="content">
        <div class="logo1">
            <img src="fotos/name.png" alt="Burger House">
        </div>
    </section>

    <section class="menu-section">

        <div class="List">
            <h2>Unsere Speisekarte</h2>
            <p>Entdecke unsere Burger, Beilagen und Getränke.</p>
        </div>

        <nav
            class="category-slider"
            id="categorySlider"
            aria-label="Speisekarten-Kategorien">
        </nav>

        <div class="container">

            <!-- Speisekarte -->
            <div class="menu" id="menu"></div>

            <!-- Warenkorb -->
            <aside class="basket">

                <h2>Dein Warenkorb</h2>

                <div id="basketItems"></div>

                <hr>

                <p>
                    <span>Zwischensumme:</span>
                    <span>
                        <span id="subtotal">0.00</span> €
                    </span>
                </p>

                <p>
                    <span>Lieferkosten:</span>
                    <span>
                        <span id="delivery">4.99</span> €
                    </span>
                </p>

                <p class="total">
                    <span>Gesamt:</span>
                    <span>
                        <span id="total">0.00</span> €
                    </span>
                </p>

                <!-- Warenkorb leeren -->
                <button
                    type="button"
                    class="clear-button"
                    onclick="clearBasket()">
                    Warenkorb leeren
                </button>

                <!-- Bestellen -->
                <button
                    type="button"
                    class="checkout-button"
                    onclick="checkout()">
                    Jetzt kaufen
                </button>

            </aside>

        </div>
    </section>

</main>

</body>
</html>
```
